# OpenSSF Scorecard - Security posture analysis
# Runs weekly and on PR changes to .github/workflows
name: "Scorecard"
on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
permissions:
  contents: read
  security-events: write
  id-token: write
jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Run Scorecard"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Upload SARIF results to GitHub Security tab"
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: "Fail on critical findings"
        if: always()
        run: |
          if [ -f results.sarif ]; then
            CRITICAL=$(jq '[.runs[].results[]? | select(.level == "error")] | length' results.sarif)
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Scorecard found $CRITICAL critical findings"
              exit 1
            fi
          fi
