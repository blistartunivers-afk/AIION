name: Source Archive Provenance
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create source archive from checked-out commit
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-with-provenance
          path: source.tar.gz
          if-no-files-found: error
