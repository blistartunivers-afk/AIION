[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiion"
version = "0.1.0"
description = "AIION: Ecosistema autónomo de inteligencia"
authors = [{name = "Estiven", email = "estiven@blist.com"}]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pytest",
    "pytest-mock"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools]
packages = ["aiion"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
